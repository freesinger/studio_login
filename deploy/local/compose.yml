services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: studio_login
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - studio_login_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  studio_login_mysql_data:
